  <!-- First paint without a flash (SG.theme): applies the stored theme, motion and text size before the
       stylesheets paint. It reads the key of js/ui/store.js; any failure leaves the defaults. -->
  <script>
    (function () {
      var html = document.documentElement;
      var prefs = null;
      try { prefs = JSON.parse(localStorage.getItem('sg.player.prefs.v1')); } catch (e) { prefs = null; }
      if (!prefs || typeof prefs !== 'object') prefs = {};
      if (prefs.theme === 'light' || prefs.theme === 'dark' || prefs.theme === 'high-contrast') {
        html.setAttribute('data-theme', prefs.theme);
      } else {
        html.removeAttribute('data-theme');
      }
      if (prefs.reducedMotion === true) html.setAttribute('data-motion', 'off');
      if (prefs.fontSize === 'small') html.style.setProperty('--sg-font-size-base', '87.5%');
      else if (prefs.fontSize === 'large') html.style.setProperty('--sg-font-size-base', '125%');
    })();
  </script>
