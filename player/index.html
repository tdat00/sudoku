  <!-- First paint without a flash (SG.theme): applies the stored theme, motion and text size before the
       stylesheets paint. It reads the key of js/ui/store.js; any failure leaves the defaults. -->
  <script>
    (function () {
      var html = document.documentElement;
      var prefs = null;
      try { prefs = JSON.parse(localStorage.getItem('sg.player.prefs.v1')); } catch (e) { prefs = null; }
      if (!prefs || typeof prefs !== 'object') prefs = {};
      if (prefs.theme === 'light' || prefs.theme === 'dark' || prefs.theme === 'high-contrast') {
        html.setAttribute('data-theme', prefs.theme);
      } else {
        html.removeAttribute('data-theme');
      }
      if (prefs.reducedMotion === true) html.setAttribute('data-motion', 'off');
      if (prefs.fontSize === 'small') html.style.setProperty('--sg-font-size-base', '87.5%');
      else if (prefs.fontSize === 'large') html.style.setProperty('--sg-font-size-base', '125%');
    })();
  </script>

            </button>
          </div>
        </div>
        <div class="board-frame">

            role="img" aria-labelledby="board-title board-desc" focusable="false">
            <title id="board-title" data-i18n="shell.board.title"></title>
            <desc id="board-desc" data-i18n="shell.board.desc"></desc>
          </svg>
        </div>
        <div id="board-legend" class="board-legend"></div>
      </section>

      <aside id="side-root" class="side" aria-labelledby="side-heading">
        <h2 id="side-heading" class="visually-hidden" data-i18n="shell.side.heading"></h2>
        <div id="play-status">

            <p id="status-line" class="status-row__text" role="status" aria-live="off"></p>
          </div>
        </div>
        <div id="play-root"></div>
        <div id="options-root"></div>
      </aside>
    </div>
