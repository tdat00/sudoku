<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="sg-generator-url" content="https://tdat00.github.io/sudoku-generator/">
  <title data-i18n="app.title">Sudoku Player</title>
  <!-- First paint without a flash (SG.theme): applies the stored theme, motion and text size before the
       stylesheets paint. It reads the key of js/ui/store.js; any failure leaves the defaults. -->
  <script>
    (function () {
      var html = document.documentElement;
      var prefs = null;
      try { prefs = JSON.parse(localStorage.getItem('sg.player.prefs.v1')); } catch (e) { prefs = null; }
      if (!prefs || typeof prefs !== 'object') prefs = {};
      if (prefs.theme === 'light' || prefs.theme === 'dark' || prefs.theme === 'high-contrast') {
        html.setAttribute('data-theme', prefs.theme);
      } else {
        html.removeAttribute('data-theme');
      }
      if (prefs.reducedMotion === true) html.setAttribute('data-motion', 'off');
      if (prefs.fontSize === 'small') html.style.setProperty('--sg-font-size-base', '87.5%');
      else if (prefs.fontSize === 'large') html.style.setProperty('--sg-font-size-base', '125%');
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/tokens-board.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/board.css">
  <link rel="stylesheet" href="css/play.css">
  <link rel="stylesheet" href="css/help.css">
</head>
<body>
  <!-- Icon sprite: <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-NAME"></use></svg> -->
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="ic-logo" viewBox="0 0 24 24">
      <rect x="2.5" y="2.5" width="19" height="19" rx="3"></rect>
      <path d="M8.8 2.5v19M15.2 2.5v19M2.5 8.8h19M2.5 15.2h19" stroke-width="1.5"></path>
      <rect x="8.8" y="8.8" width="6.4" height="6.4" fill="currentColor" stroke="none"></rect>
    </symbol>
    <symbol id="ic-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8"></path>
    </symbol>
    <symbol id="ic-moon" viewBox="0 0 24 24">
      <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"></path>
    </symbol>
    <symbol id="ic-contrast" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"></path>
    </symbol>
    <symbol id="ic-settings" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9.6" stroke-width="3" stroke-dasharray="2.5 2.48"></circle>
      <circle cx="12" cy="12" r="6.8"></circle>
      <circle cx="12" cy="12" r="2.4"></circle>
    </symbol>
    <symbol id="ic-help" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M9.4 9.3a2.7 2.7 0 0 1 5.2.9c0 1.8-2.6 2.3-2.6 4"></path>
      <circle cx="12" cy="17.3" r="0.7" fill="currentColor"></circle>
    </symbol>
    <symbol id="ic-play" viewBox="0 0 24 24">
      <path d="M7 4.5v15l13-7.5z" fill="currentColor"></path>
    </symbol>
    <symbol id="ic-pause" viewBox="0 0 24 24">
      <rect x="6" y="4.5" width="4.2" height="15" rx="1" fill="currentColor" stroke="none"></rect>
      <rect x="13.8" y="4.5" width="4.2" height="15" rx="1" fill="currentColor" stroke="none"></rect>
    </symbol>
    <symbol id="ic-chevron-up" viewBox="0 0 24 24">
      <path d="M6 15l6-6 6 6"></path>
    </symbol>
    <symbol id="ic-chevron-down" viewBox="0 0 24 24">
      <path d="M6 9l6 6 6-6"></path>
    </symbol>
    <symbol id="ic-folder" viewBox="0 0 24 24">
      <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h4l2 2.5h7A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"></path>
    </symbol>
    <symbol id="ic-upload" viewBox="0 0 24 24">
      <path d="M12 15.5V4M7.5 8.5L12 4l4.5 4.5M5 19.5h14"></path>
    </symbol>
    <symbol id="ic-x" viewBox="0 0 24 24">
      <path d="M6 6l12 12M18 6L6 18"></path>
    </symbol>
    <symbol id="ic-check" viewBox="0 0 24 24">
      <path d="M5 12.5l4.5 4.5L19 7.5"></path>
    </symbol>
    <symbol id="ic-copy" viewBox="0 0 24 24">
      <rect x="9" y="9" width="11" height="11" rx="2"></rect>
      <path d="M5 15V6a2 2 0 0 1 2-2h8"></path>
    </symbol>
    <symbol id="ic-trash" viewBox="0 0 24 24">
      <path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 12.5h9l1-12.5M10 11v5.5M14 11v5.5"></path>
    </symbol>
    <symbol id="ic-alert" viewBox="0 0 24 24">
      <path d="M12 3.5l9.5 16.5h-19z"></path>
      <path d="M12 10v4.5"></path>
      <circle cx="12" cy="17.4" r="0.7" fill="currentColor"></circle>
    </symbol>
    <symbol id="ic-external" viewBox="0 0 24 24">
      <path d="M14 4.5h5.5V10M19.5 4.5L11 13M17.5 14v4a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 18V8A1.5 1.5 0 0 1 6 6.5h4"></path>
    </symbol>
  </svg>

  <a id="skip-link" class="skip-link" href="#main" data-i18n="shell.skip"></a>

  <header class="app-header">
    <div class="app-header__inner">
      <div class="app-brand">
        <svg class="icon icon--brand" aria-hidden="true" focusable="false"><use href="#ic-logo"></use></svg>
        <h1 id="app-title" class="app-title" data-i18n="app.title"></h1>
      </div>

      <div class="app-tools">
        <button id="btn-open" type="button" class="btn btn--primary" aria-haspopup="dialog"
          data-i18n-attr="title:shell.open.title">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-folder"></use></svg>
          <span class="btn__label" data-i18n="shell.open"></span>
        </button>

        <div id="lang-switch" class="segmented" role="group" data-i18n-attr="aria-label:shell.lang.label">
          <button type="button" class="segmented__btn" data-lang="en" lang="en" aria-pressed="true"
            data-i18n-attr="aria-label:shell.lang.en.name,title:shell.lang.en.name"
            data-i18n="shell.lang.en.short"></button>
          <button type="button" class="segmented__btn" data-lang="vi" lang="vi" aria-pressed="false"
            data-i18n-attr="aria-label:shell.lang.vi.name,title:shell.lang.vi.name"
            data-i18n="shell.lang.vi.short"></button>
        </div>

        <div id="theme-switch" class="segmented" role="group" data-i18n-attr="aria-label:shell.theme.label">
          <button type="button" class="segmented__btn segmented__btn--icon" data-theme-value="light"
            aria-pressed="true" data-i18n-attr="aria-label:shell.theme.light,title:shell.theme.light">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-sun"></use></svg>
          </button>
          <button type="button" class="segmented__btn segmented__btn--icon" data-theme-value="dark"
            aria-pressed="false" data-i18n-attr="aria-label:shell.theme.dark,title:shell.theme.dark">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-moon"></use></svg>
          </button>
          <button type="button" class="segmented__btn segmented__btn--icon" data-theme-value="high-contrast"
            aria-pressed="false"
            data-i18n-attr="aria-label:shell.theme.highContrast,title:shell.theme.highContrast">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-contrast"></use></svg>
          </button>
        </div>

        <button id="btn-settings" type="button" class="btn btn--ghost" aria-haspopup="dialog"
          data-i18n-attr="title:shell.settings.title">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-settings"></use></svg>
          <span class="btn__label" data-i18n="shell.settings"></span>
        </button>
        <button id="btn-help" type="button" class="btn btn--ghost" aria-haspopup="dialog"
          data-i18n-attr="title:shell.help.title">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-help"></use></svg>
          <span class="btn__label" data-i18n="shell.help"></span>
        </button>
      </div>
    </div>
  </header>

  <noscript>
    <p class="noscript">Sudoku Player needs JavaScript. / Trình chơi Sudoku cần bật JavaScript.</p>
  </noscript>

  <main id="main" class="app-main" tabindex="-1">
    <section id="welcome" class="welcome" aria-labelledby="welcome-title">
      <div class="welcome__card">
        <h2 id="welcome-title" class="welcome__title" data-i18n="shell.welcome.title"></h2>
        <p class="welcome__lead" data-i18n="shell.welcome.lead"></p>
        <ol class="welcome__steps">
          <li data-i18n="shell.welcome.step1"></li>
          <li data-i18n="shell.welcome.step2"></li>
          <li data-i18n="shell.welcome.step3"></li>
        </ol>
        <div class="welcome__actions">
          <button id="btn-welcome-open" type="button" class="btn btn--primary" aria-haspopup="dialog">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-folder"></use></svg>
            <span class="btn__label" data-i18n="shell.welcome.open"></span>
          </button>
          <a id="link-generator" class="btn btn--secondary" href="https://tdat00.github.io/sudoku-generator/"
            target="_blank" rel="noopener">
            <span class="btn__label" data-i18n="shell.welcome.generator"></span>
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-external"></use></svg>
          </a>
        </div>
        <p class="welcome__note" data-i18n="shell.welcome.privacy"></p>
      </div>
      <div id="welcome-recent" class="welcome__recent"></div>
    </section>

    <div id="player-layout" class="player-layout" hidden>
      <section id="board-root" class="board-area" aria-labelledby="board-heading">
        <h2 id="board-heading" class="board-heading"></h2>
        <div id="play-status" class="play-status-host"></div>
        <div class="board-frame">
          <svg id="board-svg" class="board-svg" viewBox="0 0 9 9" preserveAspectRatio="xMidYMid meet"
            role="img" aria-labelledby="board-title board-desc" focusable="false">
            <title id="board-title" data-i18n="shell.board.title"></title>
            <desc id="board-desc" data-i18n="shell.board.desc"></desc>
          </svg>
        </div>
        <div id="board-legend" class="board-legend"></div>
      </section>

      <aside id="side-root" class="side" aria-labelledby="side-heading">
        <h2 id="side-heading" class="visually-hidden" data-i18n="shell.side.heading"></h2>
        <div id="play-root" class="side__play"></div>
        <details id="info-details" class="disclosure side__info" open>
          <summary><span data-i18n="shell.info.title"></span></summary>
          <div id="info-root" class="disclosure__body"></div>
        </details>
        <details id="recent-details" class="disclosure side__recent">
          <summary><span data-i18n="shell.recent.title"></span></summary>
          <div id="recent-root" class="disclosure__body"></div>
        </details>
      </aside>
    </div>

    <div class="status-row">
      <span class="status-row__label" data-i18n="shell.status.label"></span>
      <p id="status-line" class="status-row__text" role="status" aria-live="off"></p>
    </div>
  </main>

  <div id="drop-overlay" class="drop-overlay" hidden>
    <div class="drop-overlay__card">
      <svg class="icon icon--xl" aria-hidden="true" focusable="false"><use href="#ic-upload"></use></svg>
      <p class="drop-overlay__title" data-i18n="shell.drop.title"></p>
      <p class="drop-overlay__hint" data-i18n="shell.drop.hint"></p>
    </div>
  </div>

  <div id="modal-root" class="modal-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite" aria-relevant="additions"
    data-i18n-attr="aria-label:shell.toast.label"></div>
  <div id="a11y-live" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Order = SOURCE_FILES in tests/node-runner.js (also tests.html). -->
  <script src="js/core/ns.js"></script>
  <script src="js/core/errors.js"></script>
  <script src="js/core/bits.js"></script>
  <script src="js/core/budget.js"></script>
  <script src="js/core/model.js"></script>
  <script src="js/core/constraints.js"></script>
  <script src="js/core/combo-table.js"></script>
  <script src="js/core/dfs-solver.js"></script>
  <script src="js/core/techniques.js"></script>
  <script src="js/core/logical-solver.js"></script>
  <script src="js/core/tech-basic.js"></script>
  <script src="js/core/tech-subset.js"></script>
  <script src="js/core/tech-fish.js"></script>
  <script src="js/core/tech-wing.js"></script>
  <script src="js/core/tech-chain.js"></script>
  <script src="js/core/tech-cage.js"></script>
  <script src="js/core/tech-ineq.js"></script>
  <script src="js/core/model-aids.js"></script>
  <script src="js/core/classic-model.js"></script>
  <script src="js/ui/exchange.js"></script>
  <script src="js/ui/importer.js"></script>
  <script src="js/ui/i18n.js"></script>
  <script src="js/ui/locale.en.js"></script>
  <script src="js/ui/locale.vi.js"></script>
  <script src="js/ui/locale.shell.js"></script>
  <script src="js/ui/store.js"></script>
  <script src="js/ui/theme.js"></script>
  <script src="js/ui/symbols.js"></script>
  <script src="js/ui/board-view.js"></script>
  <script src="js/ui/a11y.js"></script>
  <script src="js/ui/progress.js"></script>
  <script src="js/ui/play.js"></script>
  <script src="js/ui/help.js"></script>
  <script src="js/ui/app.js"></script>
</body>
</html>
