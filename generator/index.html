<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Address of the sudoku-player web app; the Play button of the main panel opens it with the puzzle in
       the URL fragment (../core/js/ui/exchange.js, js/ui/export.js). -->
  <meta name="sg-player-url" content="../player/index.html">
  <title data-i18n="app.title">Sudoku Generator</title>
  <!-- First paint without a flash (SG.theme): applies the stored theme, motion and text size before the
       stylesheets paint. It mirrors applyPrefs of js/ui/app.js; any failure leaves the defaults. -->
  <script>
    (function () {
      var html = document.documentElement;
      var prefs = null;
      try { prefs = JSON.parse(localStorage.getItem('sg.prefs.v1')); } catch (e) { prefs = null; }
      if (!prefs || typeof prefs !== 'object') prefs = {};
      if (prefs.theme === 'light' || prefs.theme === 'dark' || prefs.theme === 'high-contrast') {
        html.setAttribute('data-theme', prefs.theme);
      } else {
        html.removeAttribute('data-theme');
      }
      if (prefs.reducedMotion === true) html.setAttribute('data-motion', 'off');
      if (prefs.fontSize === 'small') html.style.setProperty('--sg-font-size-base', '87.5%');
      else if (prefs.fontSize === 'large') html.style.setProperty('--sg-font-size-base', '125%');
    })();
  </script>

  <link rel="stylesheet" href="../core/css/tokens-board.css">

</head>

  <a id="skip-link" class="skip-link" href="#main" data-i18n="shell.skip"></a>

  <header class="app-header">
    <div class="app-header__inner">
      <div class="app-brand">
        <svg class="icon icon--brand" aria-hidden="true" focusable="false"><use href="#ic-logo"></use></svg>
        <h1 id="app-title" class="app-title" data-i18n="app.title"></h1>
      </div>

      <div class="app-tools">
        <div id="lang-switch" class="segmented" role="group" data-i18n-attr="aria-label:shell.lang.label">
          <button type="button" class="segmented__btn" data-lang="en" lang="en" aria-pressed="true"
            data-i18n-attr="aria-label:shell.lang.en.name,title:shell.lang.en.name"
            data-i18n="shell.lang.en.short"></button>
          <button type="button" class="segmented__btn" data-lang="vi" lang="vi" aria-pressed="false"
            data-i18n-attr="aria-label:shell.lang.vi.name,title:shell.lang.vi.name"
            data-i18n="shell.lang.vi.short"></button>
        </div>

        <div id="theme-switch" class="segmented" role="group" data-i18n-attr="aria-label:shell.theme.label">
          <button type="button" class="segmented__btn segmented__btn--icon" data-theme-value="light"
            aria-pressed="true" data-i18n-attr="aria-label:shell.theme.light,title:shell.theme.light">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-sun"></use></svg>
          </button>
          <button type="button" class="segmented__btn segmented__btn--icon" data-theme-value="dark"
            aria-pressed="false" data-i18n-attr="aria-label:shell.theme.dark,title:shell.theme.dark">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-moon"></use></svg>
          </button>
          <button type="button" class="segmented__btn segmented__btn--icon" data-theme-value="high-contrast"
            aria-pressed="false"
            data-i18n-attr="aria-label:shell.theme.highContrast,title:shell.theme.highContrast">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-contrast"></use></svg>
          </button>
        </div>

        <button id="btn-settings" type="button" class="btn btn--ghost" aria-haspopup="dialog"
          data-i18n-attr="title:shell.settings.title">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-settings"></use></svg>
          <span class="btn__label" data-i18n="shell.settings"></span>
        </button>
        <button id="btn-help" type="button" class="btn btn--ghost" aria-haspopup="dialog"
          data-i18n-attr="title:shell.help.title">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-help"></use></svg>
          <span class="btn__label" data-i18n="shell.help"></span>
        </button>
      </div>
    </div>
  </header>

  <div class="app-layout" id="app-layout">
    <button id="btn-drawer" type="button" class="drawer-toggle" aria-expanded="false"
      aria-controls="controls-root" data-i18n-attr="title:shell.drawer.title">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-sliders"></use></svg>
      <span data-i18n="shell.drawer.toggle"></span>
      <svg class="icon drawer-toggle__chevron" aria-hidden="true" focusable="false"><use href="#ic-chevron-up"></use></svg>
    </button>

    <aside id="history-root" class="panel panel--history" aria-labelledby="history-heading">
      <div class="panel__header">
        <h2 id="history-heading" class="panel__title" data-i18n="history.title"></h2>
        <button id="history-clear" type="button" class="btn btn--ghost btn--sm" disabled
          data-i18n-attr="title:history.clear.title">
          <span class="btn__label" data-i18n="history.clear"></span>
        </button>
      </div>
      <p id="history-empty" class="empty-hint" data-i18n="history.empty"></p>
      <ul id="history-list" class="history-list" hidden></ul>
    </aside>

    <main id="main" class="app-main" tabindex="-1">
      <div class="main-head">
        <div class="main-head__titles">
          <h2 id="puzzle-heading" class="main-head__title"></h2>
          <p id="puzzle-subheading" class="main-head__subtitle"></p>
        </div>
        <div class="main-actions" role="group" data-i18n-attr="aria-label:shell.mainActions.label">
          <button id="btn-play-online" type="button" class="btn btn--secondary" disabled
            data-i18n-attr="title:shell.btn.playOnline.title">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-play"></use></svg>
            <span class="btn__label" data-i18n="shell.btn.playOnline"></span>
          </button>
          <button id="btn-export" type="button" class="btn btn--secondary" disabled
            aria-haspopup="dialog" data-i18n-attr="title:shell.btn.export.title">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-print"></use></svg>
            <span class="btn__label" data-i18n="shell.btn.export"></span>
          </button>
          <button id="btn-export-code" type="button" class="btn btn--secondary" disabled
            aria-haspopup="dialog" data-i18n-attr="title:shell.btn.exportCode.title">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-share"></use></svg>
            <span class="btn__label" data-i18n="shell.btn.exportCode"></span>
          </button>
        </div>
      </div>

      <section id="board-root" class="board-area" aria-labelledby="board-heading">
        <h2 id="board-heading" class="visually-hidden" data-i18n="shell.board.heading"></h2>
        <div class="board-frame">
          <svg id="board-svg" class="board-svg" viewBox="0 0 9 9" preserveAspectRatio="xMidYMid meet"
            role="img" aria-labelledby="board-title board-desc" focusable="false">
            <title id="board-title" data-i18n="shell.board.title"></title>
            <desc id="board-desc" data-i18n="shell.board.desc"></desc>
          </svg>
        </div>
      </section>

      <section id="player-root" class="player" aria-labelledby="player-heading">
        <h2 id="player-heading" class="visually-hidden" data-i18n="shell.player.heading"></h2>

        <div class="player__tabs" role="tablist" data-i18n-attr="aria-label:shell.tabs.label">
          <button id="tab-result" type="button" class="tab" role="tab" aria-selected="true"
            aria-controls="result-panel" data-tab="result" data-i18n="shell.tab.result"></button>
          <button id="tab-steps" type="button" class="tab" role="tab" aria-selected="false" tabindex="-1"
            aria-controls="steps-root" data-tab="steps" data-i18n="shell.tab.steps"></button>
        </div>

        <div id="result-panel" class="player__panel" role="tabpanel" aria-labelledby="tab-result">
          <section id="result-root" class="result-area" data-i18n-attr="aria-label:shell.result.label"></section>
        </div>

        <div id="steps-root" class="player__panel" role="tabpanel" aria-labelledby="tab-steps" hidden>
          <div class="player__controls">
            <div class="player__transport" role="group" data-i18n-attr="aria-label:player.label">
              <button id="btn-first" type="button" class="btn btn--icon btn--secondary" disabled
                data-i18n-attr="aria-label:player.first,title:player.first">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-first"></use></svg>
              </button>
              <button id="btn-prev" type="button" class="btn btn--icon btn--secondary" disabled
                data-i18n-attr="aria-label:player.prev,title:player.prev">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-prev"></use></svg>
              </button>
              <button id="btn-next" type="button" class="btn btn--icon btn--secondary" disabled
                data-i18n-attr="aria-label:player.next,title:player.next">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-next"></use></svg>
              </button>
              <button id="btn-last" type="button" class="btn btn--icon btn--secondary" disabled
                data-i18n-attr="aria-label:player.last,title:player.last">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-last"></use></svg>
              </button>
            </div>

            <div class="player__timeline">
              <div class="player__track">
                <input id="scrubber" class="slider" type="range" min="0" max="0" step="1" value="0" disabled
                  data-i18n-attr="aria-label:player.scrubber">
                <div class="player__ticks" aria-hidden="true"></div>
              </div>
              <span id="player-time" class="player__time"></span>
            </div>
          </div>

          <div class="panel__header panel__header--start">
            <h2 id="steps-heading" class="panel__title"></h2>
            <button id="btn-explain" type="button" class="btn btn--ghost btn--icon btn--sm" aria-haspopup="dialog"
              data-i18n-attr="aria-label:shell.btn.explain,title:shell.btn.explain.title">
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-help"></use></svg>
            </button>
          </div>
          <div id="step-detail" class="step-detail" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <div class="app-side">
      <aside id="controls-root" class="panel panel--controls" aria-labelledby="controls-heading">
        <h2 id="controls-heading" class="panel__title" data-i18n="shell.controls.heading"></h2>
        <div class="controls-actions" role="group" data-i18n-attr="aria-label:shell.actions.label">
          <button id="btn-generate" type="button" class="btn btn--primary btn--block"
            data-i18n-attr="title:shell.btn.generate.title">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-sparkle"></use></svg>
            <span class="btn__label" data-i18n="shell.btn.generate"></span>
          </button>
          <button id="btn-regenerate" type="button" class="btn           btn--secondary btn--block"
            data-i18n-attr="title:shell.btn.regenerate.title">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-refresh"></use></svg>
            <span class="btn__label" data-i18n="shell.btn.regenerate"></span>
          </button>
          <button id="btn-cancel" type="button" class="btn btn--ghost btn--block" hidden
            data-i18n-attr="title:shell.btn.cancel.title">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-x"></use></svg>
            <span class="btn__label" data-i18n="shell.btn.cancel"></span>
          </button>
        </div>
        <form id="controls-form" class="controls-form" novalidate autocomplete="off"
          aria-labelledby="controls-heading"></form>
      </aside>
      <div class="drawer-backdrop" aria-hidden="true"></div>
    </div>
  </div>

  <footer class="app-footer">
    <p class="app-footer__inner">
      <span class="app-footer__copy" data-i18n="shell.footer.copyright"></span>
      <a class="app-footer__link" href="https://github.com/tdat00/sudoku/tree/main/generator" target="_blank"
        rel="noopener noreferrer" data-i18n="shell.footer.repo"
        data-i18n-attr="title:shell.footer.repo.title"></a>
    </p>
  </footer>

  <div id="modal-root" class="modal-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite" aria-relevant="additions"
    data-i18n-attr="aria-label:shell.toast.label"></div>
  <div id="a11y-live" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
