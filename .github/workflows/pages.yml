name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run the generator tests
        working-directory: generator
        run: node tests/node-runner.js --all

      - name: Run the player tests
        working-directory: player
        run: node tests/node-runner.js

      # One site: / (landing page), /generator/, /player/ and /core/, the code both apps load with ../core.
      # The tests, the design notes and the documents are not published.
      - name: Prepare site
        run: |
          mkdir -p _site/generator _site/player _site/core
          cp index.html LICENSE _site/
          cp -R generator/index.html generator/css generator/js generator/assets _site/generator/
          cp -R player/index.html player/help.html player/css player/js player/assets _site/player/
          cp -R core/js core/css core/assets _site/core/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
